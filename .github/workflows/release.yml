# Builds the signed phone and watch APKs and publishes them on GitHub.
#
# - Every push to main (each merged pull request) becomes a release tagged
#   <appVersion from gradle.properties>.<run number>, e.g. 1.1.57, with the phone APK, the
#   Wear OS watch APK and update.json, which the in-app updater reads from the latest release.
# - A release published by hand (Releases -> Draft a new release) gets the APKs attached.
# - Run by hand from the Actions tab: the APKs are kept as a workflow artifact.
#
# The versionCode is the run number plus 100 (above the hand-made 1.0.0/1.1.0 releases), so
# every new build installs over the previous one.
#
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64     the release keystore, base64-encoded
#   KEYSTORE_PASSWORD   its password
#   KEY_ALIAS           the key's alias
#   KEY_PASSWORD        the key's password
# Always sign with the same keystore: Android only installs an update signed with the same key.
name: Release APK

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SING_BOX_TAG: v1.14.2
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      # The sing-box core (libbox.aar) is built with gomobile and needs the NDK; it only changes
      # with the sing-box tag or the build script, so it is cached.
      - name: Cache libbox
        id: libbox
        uses: actions/cache@v4
        with:
          path: core/libs/libbox.aar
          key: libbox-${{ env.SING_BOX_TAG }}-${{ hashFiles('scripts/build-libbox.sh') }}

      - name: Build libbox (sing-box core)
        if: steps.libbox.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" bash scripts/build-libbox.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing; an unsigned APK can't be installed. See the top of this file."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "WEARLINK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Work out the version
        run: |
          BASE="$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '[:space:]')"
          case "${{ github.event_name }}" in
            release) NAME="${{ github.event.release.tag_name }}"; NAME="${NAME#v}" ;;
            *) NAME="${BASE:-1.1}.${{ github.run_number }}" ;;
          esac
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          WEARLINK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WEARLINK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WEARLINK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # A bigger heap for R8; lintVitalRelease only slows the runner down.
        run: |
          chmod +x gradlew
          ./gradlew :shared:test :mobile:assembleRelease :wear:assembleRelease \
            -x lintVitalRelease \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"
          mkdir -p dist
          PHONE="WearLink-$VERSION_NAME.apk"
          WATCH="WearLink-Watch-$VERSION_NAME.apk"
          cp mobile/build/outputs/apk/release/mobile-release.apk "dist/$PHONE"
          cp wear/build/outputs/apk/release/wear-release.apk "dist/$WATCH"
          # The in-app updater reads this from releases/latest/download/update.json.
          jq -n \
            --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" \
            --arg phone "$PHONE" --arg watch "$WATCH" \
            --arg phoneSha "$(sha256sum "dist/$PHONE" | cut -d' ' -f1)" \
            --arg watchSha "$(sha256sum "dist/$WATCH" | cut -d' ' -f1)" \
            --arg notes "${{ github.event.head_commit.message }}" \
            '{versionCode: $code, versionName: $name, notes: ($notes | split("\n")[0]),
              phoneApk: $phone, watchApk: $watch, phoneSha256: $phoneSha, watchSha256: $watchSha}' \
            > dist/update.json

      - name: Attach the APKs to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      - name: Publish a release for the push to main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION_NAME" dist/* \
            --target "${{ github.sha }}" \
            --title "WearLink $VERSION_NAME" \
            --generate-notes

      - name: Keep the APKs as an artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: WearLink-${{ env.VERSION_NAME }}
          path: dist/
