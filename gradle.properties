org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# WearLink's release version. Every push to main is published as <appVersion>.<CI run number>
# (e.g. 1.1.57); raise it for a new major/minor version.
appVersion=1.1
# Where the in-app updater looks for update.json and the APKs.
wearlink.updateBaseUrl=https://github.com/HuTao1Love/WearLink/releases/latest/download/
