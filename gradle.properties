org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# App version, shared by the phone and watch APKs. Bump both before scripts/release.sh.
wearlink.versionCode=1
wearlink.versionName=1.0.0
# Where the in-app updater looks for update.json and the APKs.
wearlink.updateBaseUrl=https://github.com/HuTao1Love/WearLink/releases/latest/download/
